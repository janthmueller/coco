name: Documentation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/docs-pages.yml'
      - 'docs/**'
      - 'flake.lock'
      - 'flake.nix'
  pull_request:
    paths:
      - '.github/workflows/docs-pages.yml'
      - 'docs/**'
      - 'flake.lock'
      - 'flake.nix'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    env:
      DOCS_BASE_PATH: ${{ vars.DOCS_BASE_PATH || format('/{0}', github.event.repository.name) }}
      NEXT_PUBLIC_REPOSITORY_URL: ${{ format('{0}/{1}', github.server_url, github.repository) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.21.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install documentation dependencies
        run: pnpm --dir docs install --frozen-lockfile

      - name: Check documentation sources
        run: pnpm --dir docs check

      - name: Build and verify static export
        run: pnpm --dir docs build

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          include-hidden-files: true
          path: docs/out

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
