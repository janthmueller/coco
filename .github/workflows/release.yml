name: Release

on:
  workflow_run:
    workflows: ["Rust"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        default: alpha
        type: choice
        options:
          - alpha
          - stable
      publish:
        description: Publish the selected channel instead of only rehearsing
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  guard:
    if: >
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (
        github.event_name == 'workflow_run' &&
        vars.COCO_RELEASE_ENABLED == 'true' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    outputs:
      target_sha: ${{ steps.check.outputs.target_sha }}
      publish_requested: ${{ steps.check.outputs.publish_requested }}
      channel: ${{ steps.check.outputs.channel }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Require the selected and tested main revision
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          COCO_RELEASE_ENABLED: ${{ vars.COCO_RELEASE_ENABLED }}
          RELEASE_CHANNEL: ${{ github.event_name == 'workflow_run' && 'alpha' || inputs.channel }}
          PUBLISH_REQUESTED: ${{ github.event_name == 'workflow_run' && 'true' || inputs.publish }}
        run: python3 .github/scripts/release_checks.py request

  release:
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    outputs:
      released: ${{ steps.publish.outputs.released }}
      tag: ${{ steps.publish.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ needs.guard.outputs.target_sha }}

      - name: Prepare the tested main revision
        env:
          TARGET_SHA: ${{ needs.guard.outputs.target_sha }}
        run: |
          git switch -C main "$TARGET_SHA"
          git branch --set-upstream-to=origin/main main
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Rehearse selected version and build without publication
        id: rehearsal
        uses: python-semantic-release/python-semantic-release@39dd2052f2ce8282a5d932c31d58a2ca06d2550e # v10.6.1
        with:
          config_file: releaserc.toml
          github_token: ${{ secrets.GH_PAT || github.token }}
          git_committer_name: github-actions[bot]
          git_committer_email: github-actions[bot]@users.noreply.github.com
          prerelease: ${{ needs.guard.outputs.prerelease }}
          prerelease_token: alpha
          commit: false
          tag: false
          push: false
          vcs_release: false
          strict: true

      - name: Verify channel, tag, and synchronized Cargo metadata
        env:
          RELEASE_CHANNEL: ${{ needs.guard.outputs.channel }}
          RELEASE_VERSION: ${{ steps.rehearsal.outputs.version }}
          RELEASE_TAG: ${{ steps.rehearsal.outputs.tag }}
        run: python3 .github/scripts/release_checks.py version

      - name: Recheck the tested main revision before publication
        if: needs.guard.outputs.publish_requested == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          COCO_RELEASE_ENABLED: ${{ vars.COCO_RELEASE_ENABLED }}
          RELEASE_CHANNEL: ${{ needs.guard.outputs.channel }}
          PUBLISH_REQUESTED: ${{ needs.guard.outputs.publish_requested }}
        run: python3 .github/scripts/release_checks.py request

      - name: Version and publish selected release
        if: needs.guard.outputs.publish_requested == 'true'
        id: publish
        uses: python-semantic-release/python-semantic-release@39dd2052f2ce8282a5d932c31d58a2ca06d2550e # v10.6.1
        with:
          config_file: releaserc.toml
          github_token: ${{ secrets.GH_PAT || github.token }}
          git_committer_name: github-actions[bot]
          git_committer_email: github-actions[bot]@users.noreply.github.com
          prerelease: ${{ needs.guard.outputs.prerelease }}
          prerelease_token: alpha
          strict: true

  binaries:
    needs: release
    if: needs.release.outputs.released == 'true'
    uses: ./.github/workflows/binaries.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    permissions:
      contents: write

  crates-io:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    environment:
      name: crates.io
      url: https://crates.io/crates/codex-coordinator
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ needs.release.outputs.tag }}

      - name: Install the pinned Rust toolchain
        shell: bash
        run: |
          TOOLCHAIN="$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)"
          test -n "$TOOLCHAIN"
          rustup toolchain install "$TOOLCHAIN" --profile minimal

      - name: Publish codex-coordinator to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
