name: Rust

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rust.yml'
      - 'src/**'
      - 'tests/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'flake.lock'
      - 'flake.nix'
      - 'rust-toolchain.toml'
  pull_request:
    paths:
      - '.github/workflows/rust.yml'
      - 'src/**'
      - 'tests/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'flake.lock'
      - 'flake.nix'
      - 'rust-toolchain.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check formatting
        run: nix run .#fmt

      - name: Lint all Rust targets
        run: nix run .#clippy

      - name: Test all Rust targets
        run: nix run .#test -- --all-targets

      - name: Check unused dependencies
        run: nix run .#deps

      - name: Check the development flake
        run: nix flake check
