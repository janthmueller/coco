name: Rust

on:
  push:
    branches: [main]
    paths:
      - '.github/**'
      - 'CHANGELOG.md'
      - 'src/**'
      - 'tests/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'LICENSE'
      - 'README.md'
      - 'deny.toml'
      - 'flake.lock'
      - 'flake.nix'
      - 'releaserc.toml'
      - 'rust-toolchain.toml'
  pull_request:
    paths:
      - '.github/**'
      - 'CHANGELOG.md'
      - 'src/**'
      - 'tests/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'LICENSE'
      - 'README.md'
      - 'deny.toml'
      - 'flake.lock'
      - 'flake.nix'
      - 'releaserc.toml'
      - 'rust-toolchain.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check formatting
        run: nix run .#fmt

      - name: Lint all Rust targets
        run: nix run .#clippy

      - name: Test all Rust targets
        run: nix run .#test -- --all-targets

      - name: Check unused dependencies
        run: nix run .#deps

      - name: Check dependency policy
        run: nix run .#policy

      - name: Verify the crates.io package
        run: nix run .#package

      - name: Check the development flake
        run: nix flake check

  binary-smoke:
    needs: check
    uses: ./.github/workflows/binaries.yml
    with:
      tag: v0.0.0
      checkout_ref: ${{ github.sha }}
      upload: false
    permissions:
      contents: read
