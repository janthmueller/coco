[graph]
all-features = true

[advisories]
unmaintained = "all"
# Approved maintenance-risk acceptance, not a vulnerability exemption.
# cargo-deny 0.20.2 has no native expiry; nix run .#policy checks the deadline
# and exact package version with .github/scripts/check_advisory_exceptions.py.
ignore = [
  { id = "RUSTSEC-2026-0543", reason = "Until 2026-12-22: chrono is unmaintained, but the official MCP SDK still requires it. Reassess upstream before expiry; all other advisories remain blocking." },
]

[licenses]
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]

# Inline JSON Schema validation uses this transitive fluent-uri dependency.
# Reviewed MIT No Attribution; keep the exception limited to this exact crate.
[[licenses.exceptions]]
name = "borrow-or-share"
version = "=0.2.4"
allow = ["MIT-0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
