[graph]
all-features = true

[advisories]
ignore = []

[licenses]
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]

# Inline JSON Schema validation uses this transitive fluent-uri dependency.
# Reviewed MIT No Attribution; keep the exception limited to this exact crate.
[[licenses.exceptions]]
name = "borrow-or-share"
version = "=0.2.4"
allow = ["MIT-0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
