[semantic_release]
version_toml = ["Cargo.toml:package.version"]
assets = ["Cargo.lock"]
commit_parser = "conventional"
allow_zero_version = true
major_on_zero = false
commit_message = "chore(release): {version} [skip ci]\n\nAutomatically generated by python-semantic-release"
build_command = 'python .github/scripts/sync_cargo_lock.py "$NEW_VERSION"'

[semantic_release.branches.main]
match = "main"
prerelease = false

[semantic_release.publish]
upload_to_vcs_release = true
