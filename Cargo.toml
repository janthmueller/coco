[package]
name = "coco"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
description = "Local Codex agent orchestration"
publish = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
excessive_nesting = "deny"
too_many_lines = "deny"

[lib]
path = "src/lib.rs"

[[bin]]
name = "coco"
path = "src/bin/coco.rs"

[[bin]]
name = "cocod"
path = "src/bin/cocod.rs"

[[bin]]
name = "coco-mcp"
path = "src/bin/coco-mcp.rs"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
futures-util = { version = "0.3.34", features = ["sink"] }
hex = "0.4.3"
rmcp = { version = "3.2.0", default-features = false, features = ["macros", "server", "transport-io"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["handshake"] }
toml = "1.1.5"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.0", features = ["serde", "v4", "v7"] }

[dev-dependencies]
tempfile = "3.27.0"
